# LocalStack local — um container só, compartilhado pelos 4 desafios (mesma
# lógica de uma conta AWS real: um "endpoint", N recursos com nomes
# diferentes por desafio). Espelha o exemplo oficial (docs.localstack.cloud).
# Sem LOCALSTACK_AUTH_TOKEN — tier Hobby (grátis) não precisa de token.
#
# Nenhum agente roda `docker compose up` — é mutação (sobe container, ocupa
# porta), fica só documentado aqui pro Pedro rodar manualmente (ver
# .specify/memory/constitution.md Princípio II).
services:
  localstack:
    container_name: localstack-main
    # Pinned em 2026.07.1 (não :latest/2026.07.2) — trocado ao investigar o
    # travamento abaixo. Acabou não sendo a causa (travou nas duas versões),
    # mas manter pinado é mais seguro que :latest de qualquer forma.
    image: localstack/localstack:2026.07.1
    ports:
      - "127.0.0.1:4566:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # faixa de portas de serviços externos
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?defina no .env, veja README/setup}
      - DEBUG=0
      - PERSISTENCE=0
      # create-stack travava (CPU 100%, zero progresso) em todo template com VPC/EC2,
      # em 2 versões diferentes — só recurso de rede, nunca instância EC2 de verdade.
      # Suspeita: Pro usa Docker VM Manager por padrão pro EC2 (precisa do socket
      # montado acima), tentando inicializar algo pesado (AMIs) mesmo sem instância.
      # Forçando o manager leve (mock — default da Community, só CRUD em memória).
      - EC2_VM_MANAGER=mock
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
