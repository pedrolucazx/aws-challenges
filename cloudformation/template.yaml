AWSTemplateFormatVersion: '2010-09-09'
Description: Avatar upload stack for the AWS Challenges CloudFormation lab.

Resources:
  AvatarBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aws-challenges-avatars-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AvatarUploadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AvatarUploadPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${AvatarBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/aws-challenges-avatar-upload*'

  AvatarUploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-challenges-avatar-upload
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt AvatarUploadRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref AvatarBucket
      Code:
        ZipFile: |
          const { S3Client, PutObjectCommand } = require("@aws-sdk/client-s3");
          const { getSignedUrl } = require("@aws-sdk/s3-request-presigner");

          const s3 = new S3Client({});

          exports.handler = async (event) => {
            const { fileName, contentType } = event;

            if (!fileName) {
              throw new Error("fileName is required");
            }

            const command = new PutObjectCommand({
              Bucket: process.env.BUCKET_NAME,
              Key: fileName,
              ContentType: contentType || "application/octet-stream",
            });

            const uploadUrl = await getSignedUrl(s3, command, { expiresIn: 900 });

            return { uploadUrl };
          };

Outputs:
  BucketName:
    Description: Name of the created avatar bucket
    Value: !Ref AvatarBucket

  FunctionArn:
    Description: ARN of the presigned-URL Lambda
    Value: !GetAtt AvatarUploadFunction.Arn
